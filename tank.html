<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="坦克大战 · 经典 FC 风格网页小游戏">
<title>坦克大战 · TANK BATTLE</title>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#0b0b10;color:#e8e8ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100%;
  background-image:
    radial-gradient(900px 480px at 50% -10%,rgba(255,90,0,.08),transparent 60%),
    radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:auto,26px 26px;
}
.pixel{font-family:"Courier New","SimSun",monospace;font-weight:700}

/* 顶部 */
.top{width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.top h1{font-size:22px;letter-spacing:.2em;color:#ffc90e;text-shadow:0 0 14px rgba(255,201,14,.4)}
.top h1 small{display:block;font-size:10px;letter-spacing:.5em;color:#71717a;text-shadow:none}
.mute-btn{
  border:1px solid #3f3f46;background:#18181b;color:#a1a1aa;border-radius:10px;
  padding:7px 14px;font-size:12px;cursor:pointer;transition:all .15s;
}
.mute-btn:hover{color:#ffc90e;border-color:#ffc90e}

/* 舞台 */
.stage{display:flex;gap:18px;align-items:stretch;padding:6px 20px 20px;max-width:720px;width:100%;justify-content:center}
.screen{position:relative;flex:none;width:min(88vw,560px)}
canvas{
  width:100%;height:auto;display:block;border:3px solid #3f3f46;border-radius:10px;
  image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
  box-shadow:0 0 40px rgba(255,90,0,.12);
}
/* CRT 扫描线 */
.scan{
  position:absolute;inset:3px;border-radius:8px;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
.scan::after{
  content:'';position:absolute;inset:0;border-radius:8px;
  background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.4));
}

/* 覆盖层 */
.overlay{
  position:absolute;inset:3px;border-radius:8px;background:rgba(5,5,10,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;padding:20px;z-index:5;
}
.overlay[hidden]{display:none}
.overlay h2{font-size:30px;letter-spacing:.25em;color:#ffc90e;text-shadow:0 0 18px rgba(255,201,14,.5)}
.overlay h2.red{color:#e10622;text-shadow:0 0 18px rgba(225,6,34,.5)}
.overlay .sub{font-size:13px;color:#a1a1aa;line-height:1.9;letter-spacing:.05em}
.overlay .score{font-size:16px;color:#fff}
.btn{
  margin-top:6px;padding:12px 34px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(120deg,#e10622,#ff5a00);color:#fff;font-size:15px;font-weight:700;letter-spacing:.15em;
  box-shadow:0 8px 24px -6px rgba(225,6,34,.5);transition:transform .15s;
}
.btn:hover{transform:translateY(-2px)}

/* 敌我坦克图鉴 */
#roster{
  background:rgba(255,255,255,.05);border:1px solid #3f3f46;border-radius:8px;
  max-width:92%;image-rendering:pixelated;
}

/* HUD */
.hud{
  flex:none;width:170px;background:rgba(24,24,27,.85);border:1px solid #3f3f46;border-radius:10px;
  padding:16px;display:flex;flex-direction:column;gap:12px;font-size:13px;
}
.hud h3{font-size:12px;letter-spacing:.3em;color:#ffc90e;border-bottom:1px solid #3f3f46;padding-bottom:8px}
.hud .row{display:flex;justify-content:space-between;color:#a1a1aa}
.hud .row b{color:#fafafa;font-family:"Courier New",monospace;font-size:15px}
.hud .keys{font-size:11px;color:#71717a;line-height:2;border-top:1px solid #3f3f46;padding-top:10px}
.hud .keys b{color:#c8c8d0}

@media (max-width:720px){
  .stage{flex-direction:column;align-items:center}
  .hud{width:min(88vw,560px);flex-direction:row;flex-wrap:wrap;gap:8px 20px}
  .hud h3{width:100%}
  .hud .keys{width:100%}
}

/* 触摸控件（仅触屏显示） */
.touch{display:none}
@media (pointer:coarse){
  .touch{display:block;position:fixed;z-index:20;border-radius:50%;
    border:2px solid #3f3f46;background:rgba(24,24,27,.5);touch-action:none}
  #joy{width:120px;height:120px;left:18px;bottom:22px}
  #joyKnob{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;
    background:rgba(255,201,14,.5);transform:translate(-50%,-50%)}
  #fireBtn{width:76px;height:76px;right:24px;bottom:26px;display:grid;place-items:center;
    color:#ffc90e;font-weight:700;font-size:13px;letter-spacing:.1em;
    background:rgba(225,6,34,.3)}
}

footer{padding:14px;color:#4b4b52;font-size:11px;letter-spacing:.1em}
</style>
</head>
<body>

<header class="top">
  <h1 class="pixel">坦克大战<small>TANK BATTLE · 2026</small></h1>
  <button class="mute-btn" id="muteBtn" type="button">音效 ON</button>
</header>

<div class="stage">
  <div class="screen">
    <canvas id="game" width="570" height="450"></canvas>
    <div class="scan"></div>

    <div class="overlay" id="startOverlay">
      <h2 class="pixel">坦克大战</h2>
      <canvas id="roster" width="460" height="64" aria-hidden="true"></canvas>
      <div class="sub">
        消灭所有敌方坦克，保护你的基地<br>
        敌军也会攻击你的基地，守住它！<br>
        地图中央藏着 <b style="color:#ffc90e">wzR</b> 字母阵地<br><br>
        移动：WASD / 方向键<br>
        射击：空格 / J（可按住连发）<br>
        暂停：P ｜ 静音：M
      </div>
      <button class="btn" id="startBtn" type="button">开始游戏</button>
    </div>

    <div class="overlay" id="pauseOverlay" hidden>
      <h2 class="pixel">暂停</h2>
      <div class="sub">按 P 继续游戏</div>
      <button class="btn" id="resumeBtn" type="button">继续</button>
    </div>

    <div class="overlay" id="overOverlay" hidden>
      <h2 class="pixel red" id="overTitle">游戏结束</h2>
      <div class="score pixel" id="overScore">得分 0</div>
      <div class="sub" id="overSub"></div>
      <button class="btn" id="restartBtn" type="button">再来一局</button>
    </div>
  </div>

  <aside class="hud">
    <h3 class="pixel">战报</h3>
    <div class="row"><span>得分</span><b id="hudScore">0</b></div>
    <div class="row"><span>生命</span><b id="hudLives">3</b></div>
    <div class="row"><span>剩余敌军</span><b id="hudEnemies">14</b></div>
    <div class="row"><span>关卡</span><b id="hudLevel">1</b></div>
    <div class="keys">
      <b>WASD/方向键</b> 移动<br>
      <b>空格/J</b> 射击<br>
      <b>P</b> 暂停 · <b>M</b> 静音<br>
      道具：★火力 🛡护盾 ➕加命 💣清屏 ⛨基地装甲
    </div>
  </aside>
</div>

<div id="joy" class="touch"><div id="joyKnob"></div></div>
<button id="fireBtn" class="touch" type="button">开火</button>

<footer>GIVES YOU WINGS · 王子睿 · 手写 HTML5 Canvas</footer>

let grid=[];              // 当前地图（含可破坏砖块）
function resetMap(){ grid=BASE_MAP.map(r=>r.slice()); }
function tileAt(cx,cy){
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS) return null;
  return grid[cy][cx];
}
const T_SOLID={B:1,S:2,E:4};       // T=树 不挡路
function rectHitsSolid(r){          // 坦克/子弹与砖、钢、基地碰撞
  const x0=Math.floor(r.x/TILE), y0=Math.floor(r.y/TILE);
  const x1=Math.floor((r.x+r.w-0.01)/TILE), y1=Math.floor((r.y+r.h-0.01)/TILE);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){
    const t=tileAt(cx,cy);
    if(t&&T_SOLID[t]) return {cx,cy,t};
  }
  return null;
}

/* ================= 音效（WebAudio 合成，无外部资源） ================= */
let actx=null, muted=false;
function audio(){
  if(muted) return null;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function beep(freq,dur,type,vol,slide){
  const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||.12,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol){
  const a=audio(); if(!a) return;
  const len=Math.floor(a.sampleRate*dur);
  const buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(), g=a.createGain(), t=a.currentTime;
  src.buffer=buf;
  g.gain.setValueAtTime(vol||.25,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(g); g.connect(a.destination);
  src.start(t);
}
const SFX={
  shoot(){ beep(760,.07,'square',.06,180); },
  hit(){ beep(180,.06,'square',.1); },
  explode(){ noise(.3,.3); beep(90,.25,'sawtooth',.15,40); },
  power(){ beep(523,.09,'square',.1); setTimeout(()=>beep(659,.09,'square',.1),90); setTimeout(()=>beep(784,.16,'square',.1),180); },
  start(){ [392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.14,'square',.1),i*130)); }
};

/* ================= 实体 ================= */
function makeTank(x,y,dir,color,opts){
  return Object.assign({
    x,y,dir,color,size:TANK_SIZE,
    speed:95,hp:1,bulletSpeed:280,fireCd:0,fireInterval:.42,maxBullets:1,
    spawnT:0,flash:false,shield:0,alive:true,type:'player'
  },opts||{});
}
function spawnPlayer(){
  player=makeTank(4*TILE+(TILE-TANK_SIZE)/2,14*TILE+(TILE-TANK_SIZE)/2,UP,'#ffc90e',{spawnT:1.5,flash:true});
}
function spawnEnemy(type){
  const spawnX=[0,6,12,18];  /* 沿字母阵地两侧走廊空降 */
  const cx=spawnX[Math.floor(Math.random()*spawnX.length)];
  const cfg={
    basic:  {color:'#9aa4b0',speed:48, hp:1,score:100},
    fast:   {color:'#5ad1ff',speed:88, hp:1,score:200},
    power:  {color:'#ff7d92',speed:60, hp:1,score:300,bulletSpeed:230},
    armor:  {color:'#8aff9a',speed:42, hp:3,score:400}
  }[type];
  const spd=(1+Math.min(level-1,5)*.07);
  const e=makeTank(cx*TILE+(TILE-TANK_SIZE)/2,-TANK_SIZE,DOWN,cfg.color,{
    speed:cfg.speed*spd,hp:cfg.hp,type,score:cfg.score,
    bulletSpeed:(cfg.bulletSpeed||170)*Math.min(1.15,1+level*.02),
    spawnT:1.2,flash:true,
    dirTimer:2+Math.random()*2,shootCd:1+Math.random()*1.5
  });
  enemies.push(e);
}
function fire(tank){
  const cx=tank.x+TANK_SIZE/2, cy=tank.y+TANK_SIZE/2;
  const ox=cx+DX[tank.dir]*(TANK_SIZE/2+6), oy=cy+DY[tank.dir]*(TANK_SIZE/2+6);
  bullets.push({x:ox-3,y:oy-3,w:6,h:6,dir:tank.dir,speed:tank.bulletSpeed,owner:tank.type==='player'?'player':'enemy'});
  tank.fireCd=tank.fireInterval;
  SFX.shoot();
}

/* ================= 道具 ================= */
const POWER_TYPES=['star','shield','life','bomb','helmet'];
function dropPowerup(x,y){
  if(powerups.length>=2) return;
  if(Math.random()>.18) return;
  powerups.push({x:x*TILE+5,y:y*TILE+5,type:POWER_TYPES[Math.floor(Math.random()*POWER_TYPES.length)]});
}
function collectPowerup(p){
  switch(p.type){
    case 'star':
      player.fireInterval=Math.max(.18,player.fireInterval*.7);
      player.maxBullets=2; player.bulletSpeed=320; break;
    case 'shield': player.shield=6; break;
    case 'life': lives=Math.min(5,lives+1); break;
    case 'bomb':
      enemies.forEach(e=>killEnemy(e,false));
      shake=10; SFX.explode(); break;
    case 'helmet':
      for(let cy=12;cy<=14;cy++)for(let cx=7;cx<=11;cx++){
        if(cy===14&&cx===9) continue;
        if(grid[cy][cx]==='B') grid[cy][cx]='S';
      }
      setTimeout(()=>{ for(let cy=12;cy<=14;cy++)for(let cx=7;cx<=11;cx++){
        if(cy===14&&cx===9) continue;
        if(grid[cy][cx]==='S') grid[cy][cx]='B';
      }},12000);
      break;
  }
  SFX.power();
}
function killEnemy(e,countScore){
  if(!e.alive) return;
  e.alive=false;
  if(countScore!==false){ score+=e.score; destroyed++; }
  burst(e.x+TANK_SIZE/2,e.y+TANK_SIZE/2,e.color);
  SFX.explode(); shake=6;
  dropPowerup(Math.floor(e.x/TILE),Math.floor(e.y/TILE));
}
function burst(x,y,color){
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, s=40+Math.random()*90;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.3,color:Math.random()<.4?'#ffc90e':(color||'#e10622'),size:2+Math.random()*4});
  }
}

/* ================= 碰撞与移动 ================= */
function aimDir(e,t){
  const ddx=(t.x+t.size/2)-(e.x+TANK_SIZE/2);
  const ddy=(t.y+t.size/2)-(e.y+TANK_SIZE/2);
  if(Math.abs(ddx)>Math.abs(ddy)) return ddx>0?RIGHT:LEFT;
  return ddy>0?DOWN:UP;
}
function overlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function tankBlocked(r){
  if(r.x<0||r.x+r.w>COLS*TILE||r.y+r.h>ROWS*TILE) return true;
  if(r.y<0&&!(r.tank&&r.tank.y<0)) return true;  /* 出生空降：从屏幕上方入场时放行 */
  if(rectHitsSolid(r)) return true;
  const all=[player].concat(enemies);
  for(const t of all){
    if(!t||!t.alive||t===r.tank) continue;
    if(overlap(r,{x:t.x,y:t.y,w:t.size,h:t.size})) return true;
  }
  return false;
}
function moveTank(t,dir){
  t.dir=dir;
  const step=4, dist=t.speed/60;
  let dx=DX[dir]*dist, dy=DY[dir]*dist;
  let moved=false;
  for(let i=0;i<2;i++){
    const x=Math.abs(dx)>0?dx/2:0, y=Math.abs(dy)>0?dy/2:0;
    // 先 X 后 Y，支持贴墙滑动
    if(Math.abs(dx)>0){
      const nx=t.x+dx;
      if(!tankBlocked({x:nx,y:t.y,w:t.size,h:t.size,tank:t})){ t.x=nx; moved=true; }
      else dx=0;
    }
    if(Math.abs(dy)>0){
      const ny=t.y+dy;
      if(!tankBlocked({x:t.x,y:ny,w:t.size,h:t.size,tank:t})){ t.y=ny; moved=true; }
      else dy=0;
    }
    if(dx===0&&dy===0) break;
    if(moved) break;
  }
}

/* ================= 更新 ================= */
function update(dt){
  if(state!=='play') return;
  if(shake>0) shake=Math.max(0,shake-dt*20);

  /* 玩家 */
  if(player&&player.alive){
    if(player.spawnT>0) player.spawnT-=dt;
    if(player.shield>0) player.shield-=dt;
    player.fireCd-=dt;
    const dir=touchDir!=null?touchDir:(dirQueue.length?dirQueue[dirQueue.length-1]:player.dir);
    const moving=(touchDir!=null)||dirQueue.length>0;
    if(moving){ player.dir=dir; moveTank(player,dir); }
    if(fireHeld) tryFire();
  }

  /* 敌军生成 */
  if(spawned<totalEnemies){
    spawnTimer-=dt;
    const maxAlive=3+Math.min(2,Math.floor(level/2));
    if(spawnTimer<=0&&enemies.filter(e=>e.alive).length<maxAlive){
      spawnTimer=1.8;
      const types=['basic','basic','fast','power','armor'];
      const type=level>=2?types[Math.floor(Math.random()*types.length)]:(Math.random()<.25?'fast':'basic');
      spawnEnemy(type); spawned++;
    }
  }

  /* 敌军 AI：自由移动 + 追击 + 转向开火，双方对打 */
  enemies.forEach(e=>{
    if(!e.alive) return;
    if(e.spawnT>0){ e.spawnT-=dt; return; }
    e.shootCd-=dt; e.dirTimer-=dt;
    const target=(player&&player.alive)?player:{x:9*TILE,y:14*TILE,size:TANK_SIZE};
    if(e.dirTimer<=0){
      e.dirTimer=.8+Math.random()*1.6;
      if(Math.random()<.5) e.dir=aimDir(e,target);       /* 半数概率主动追击 */
      else e.dir=Math.floor(Math.random()*4);
    }
    const before={x:e.x,y:e.y};
    moveTank(e,e.dir);
    if(e.x===before.x&&e.y===before.y){                   /* 撞墙立即换向，不再顶墙 */
      e.dir=(Math.random()<.55)?aimDir(e,target):Math.floor(Math.random()*4);
      e.dirTimer=.5+Math.random()*1.2;
    }
    if(e.shootCd<=0){
      e.shootCd=.9+Math.random()*1.4;
      if(Math.random()<.7) e.dir=aimDir(e,target);        /* 开火前转向玩家/基地 */
      fire(e);
    }
  });
  enemies=enemies.filter(e=>e.alive);

  /* 子弹 */
  bullets.forEach(b=>{ b.x+=DX[b.dir]*b.speed/60; b.y+=DY[b.dir]*b.speed/60; });
  bullets=bullets.filter(b=>{
    if(b.x<-8||b.y<-8||b.x>COLS*TILE+8||b.y>ROWS*TILE+8) return false;
    /* 砖块/钢/基地 */
    const hit=rectHitsSolid({x:b.x,y:b.y,w:b.w,h:b.h});
    if(hit){
      if(hit.t==='B'){ grid[hit.cy][hit.cx]='.'; burst(hit.cx*TILE+16,hit.cy*TILE+16,'#b5532c'); SFX.hit(); }
      else if(hit.t==='S'){ SFX.hit(); burst(b.x,b.y,'#8f9aa8'); }
      else if(hit.t==='E'){ destroyBase(); }
      return false;
    }
    /* 子弹对子弹 */
    for(const o of bullets){
      if(o===b) continue;
      if(o.owner!==b.owner&&overlap(b,o)){ o.dead=true; return false; }
    }
    /* 打中坦克 */
    if(b.owner==='player'){
      for(const e of enemies){
        if(e.alive&&overlap(b,{x:e.x,y:e.y,w:e.size,h:e.size})){
          e.hp--;
          if(e.hp<=0) killEnemy(e,true);
          else SFX.hit();
          return false;
        }
      }
    } else {
      if(player&&player.alive&&player.spawnT<=0&&overlap(b,{x:player.x,y:player.y,w:player.size,h:player.size})){
        if(player.shield>0){ SFX.hit(); return false; }
        hurtPlayer(); return false;
      }
    }
    return !b.dead;
  });
  bullets=bullets.filter(b=>!b.dead);

  /* 道具拾取 */
  powerups=powerups.filter(p=>{
    if(player&&player.alive&&overlap({x:p.x,y:p.y,w:22,h:22},{x:player.x,y:player.y,w:player.size,h:player.size})){
      collectPowerup(p); return false;
    }
    return true;
  });

  /* 粒子 */
  particles=particles.filter(p=>{ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.92; p.vy*=.92; return p.life>0; });

  /* 过关判断 */
  if(spawned>=totalEnemies&&enemies.length===0&&state==='play'){
    state='pause';
    setTimeout(()=>{ if(state==='pause'){ level++; initLevel(); } },2200);
    showBanner('第 '+level+' 关 完成！');
    SFX.start();
  }
  syncHud();
}
function tryFire(){
  if(!player||!player.alive) return;
  if(player.fireCd>0) return;
  if(bullets.filter(b=>b.owner==='player').length>=player.maxBullets) return;
  fire(player);
}
function hurtPlayer(){
  burst(player.x+TANK_SIZE/2,player.y+TANK_SIZE/2,'#ffc90e');
  SFX.explode(); shake=8;
  player.alive=false; lives--;
  if(lives<=0){ gameOver('生命耗尽'); return; }
  setTimeout(()=>{ if(state==='play') spawnPlayer(); },1200);
}
function destroyBase(){
  burst(9*TILE+15,14*TILE+15,'#ffc90e');
  SFX.explode(); shake=12;
  gameOver('基地被摧毁');
}
function gameOver(reason){
  state='over';
  $('overTitle').textContent='游戏结束';
  $('overScore').textContent='得分 '+score;
  $('overSub').textContent=reason+' ｜ 坚持到第 '+level+' 关';
  $('overOverlay').hidden=false;
}
function initLevel(){
  resetMap();
  enemies=[]; bullets=[]; powerups=[]; particles=[];
  spawned=0; destroyed=0;
  totalEnemies=Math.min(20,12+level*2);
  spawnTimer=1.2;
  spawnPlayer();
  state='play';
  syncHud();
}
function startGame(){
  score=0; lives=3; level=1;
  initLevel();
  SFX.start();
  $('startOverlay').hidden=true;
  $('overOverlay').hidden=true;
}
function togglePause(){
  if(state==='play'){ state='pause'; $('pauseOverlay').hidden=false; }
  else if(state==='pause'){ state='play'; $('pauseOverlay').hidden=true; }
}
function showBanner(text){
  let el=document.createElement('div');
  el.textContent=text;
  el.style.cssText='position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:#ffc90e;font-weight:700;letter-spacing:.3em;font-size:22px;text-shadow:0 0 16px rgba(255,201,14,.6);z-index:6;pointer-events:none';
  $('game').parentElement.appendChild(el);
  setTimeout(()=>el.remove(),1800);
}
function syncHud(){
  $('hudScore').textContent=score;
  $('hudLives').textContent=lives;
  $('hudEnemies').textContent=totalEnemies-destroyed;
  $('hudLevel').textContent=level;
}

/* ================= 绘制 ================= */
function drawMap(){
  if(bgReady){
    ctx.drawImage(BG,0,0,COLS*TILE,ROWS*TILE);
    ctx.fillStyle='rgba(6,6,10,.55)';   /* 暗色层保证砖墙与坦克清晰可辨 */
  } else {
    ctx.fillStyle='#0a0a0d';
  }
  ctx.fillRect(0,0,COLS*TILE,ROWS*TILE);
  ctx.strokeStyle='rgba(255,255,255,.03)';
  for(let i=0;i<=COLS;i++){ ctx.beginPath(); ctx.moveTo(i*TILE,0); ctx.lineTo(i*TILE,ROWS*TILE); ctx.stroke(); }
  for(let i=0;i<=ROWS;i++){ ctx.beginPath(); ctx.moveTo(0,i*TILE); ctx.lineTo(COLS*TILE,i*TILE); ctx.stroke(); }
  for(let cy=0;cy<ROWS;cy++)for(let cx=0;cx<COLS;cx++){
    const t=grid[cy][cx], x=cx*TILE, y=cy*TILE;
    if(t==='B'){
      ctx.fillStyle='#b5532c'; ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle='#7a3418'; ctx.lineWidth=2;
      ctx.strokeRect(x+1,y+1,TILE-2,TILE-2);
      ctx.strokeStyle='#7a3418'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x+8,y+10); ctx.lineTo(x+TILE-8,y+10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+8,y+21); ctx.lineTo(x+TILE-8,y+21); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+16,y+1); ctx.lineTo(x+16,y+10); ctx.stroke();
    } else if(t==='S'){
      ctx.fillStyle='#8f9aa8'; ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle='#5d6876'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,TILE-2,TILE-2);
      ctx.fillStyle='#c9d2dd'; ctx.fillRect(x+6,y+6,6,6); ctx.fillRect(x+TILE-12,y+TILE-12,6,6);
      ctx.fillStyle='#5d6876'; ctx.fillRect(x+TILE-12,y+6,6,6); ctx.fillRect(x+6,y+TILE-12,6,6);
    } else if(t==='E'){
      ctx.fillStyle='#b5532c'; ctx.fillRect(x,y,TILE,TILE);
      drawEagle(x,y);
    }
  }
}
function drawEagle(x,y){
  const E=[
  "....YY....",
  "...YWWY...",
  "..YWWWWY..",
  "B.YWWWWY.B",
  "BBYWWWWYBB",
  "BBBBWWBBBB",
  "BBBBBBBBBB",
  "B.BB.BB.B.",
  "BBBB..BBBB",
  "..B....B.."
  ];
  const C={Y:'#ffc90e',W:'#f5f5f5',B:'#8a4a20'};
  E.forEach((row,ry)=>{
    for(let rx=0;rx<10;rx++){
      const ch=row[rx];
      if(ch==='.') continue;
      ctx.fillStyle=C[ch];
      ctx.fillRect(x+rx*2+6,y+ry*2+3,2,2);
    }
  });
  // 旗帜
  ctx.fillStyle='#d0d5dc'; ctx.fillRect(x+21,y+1,2,25);
  ctx.fillStyle='#e10622'; ctx.fillRect(x+22,y+1,7,5);
}

    "dd.dddddddd.dd",
    "dd.dddddddd.dd"
  ],
  armor:[
    "......bb......",
    "......bb......",
    "....bbbbbb....",
    "...bbbbbbbb...",
    "..bbhhhhhhbb..",
    "..bbbbbbbbbb..",
    "ddkbbbbbbbbkdd",
    "dgkhhhhhhhhkgd",
    "dgkbbbbbbbbkgd",
    "dgkbbbbbbbbkgd",
    "dgkbbbbbbbbkgd",
    "ddkbbbbbbbbkdd",
    "dddddddddddddd",
    "dddddddddddddd"
  ]
};
const ENEMY_COLORS={
  player:{b:'#ffc90e',h:'#ffe08a'},
  basic:{b:'#9aa4b0',h:'#c7d0da'},
  fast:{b:'#5ad1ff',h:'#aee8ff'},
  power:{b:'#ff7d92',h:'#ffb3c0'},
  armor:{b:'#8aff9a',h:'#c0ffca'}
};
function drawTank(t){
  const {x,y,size:s,dir}=t;
  ctx.save();
  ctx.translate(x+s/2,y+s/2);
  ctx.rotate(dir*Math.PI/2);
  drawEnemyBody(t);
  ctx.restore();
  /* 出生闪烁 */
  if(t.flash&&t.spawnT>0&&Math.floor(t.spawnT*12)%2===0){
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.fillRect(t.x,t.y,s,s);
  }
  /* 护盾光环 */
  if(t.shield>0){
    ctx.strokeStyle='rgba(0,229,255,'+(0.35+0.3*Math.sin(performance.now()/120))+')';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(t.x+s/2,t.y+s/2,s/2+5,0,Math.PI*2); ctx.stroke();
  }
}
function drawPlayerBody(t){
  const s=t.size;
  ctx.fillStyle='#1c1c20';
  ctx.fillRect(-s/2,-s/2,s,5); ctx.fillRect(-s/2,s/2-5,s,5);
  ctx.fillStyle='#34343a';
  for(let i=0;i<3;i++){ ctx.fillRect(-s/2+3+i*8,-s/2+1,4,3); ctx.fillRect(-s/2+3+i*8,s/2-4,4,3); }
  ctx.fillStyle=t.color; ctx.fillRect(-s/2+4,-s/2+5,s-8,s-10);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(-s/2+4,s/2-8,s-8,3);
  ctx.fillStyle='#f5f5f5'; ctx.fillRect(-5,-5,10,10);
  ctx.fillStyle=t.color; ctx.fillRect(-2,-s/2-9,4,10);
}
function drawEnemyBody(t){
  const rows=ENEMY_SPRITES[t.type];
  const col=ENEMY_COLORS[t.type];
  if(!rows||!col){ drawPlayerBody(t); return; }
  blitSprite(rows,col,-t.size/2,-t.size/2,t.size);
}
/* 通用精灵绘制（游戏内与图鉴共用） */
function blitSprite(rows,col,x,y,size){
  const px=size/14;
  const CHAR_COLOR={b:col.b,h:col.h,k:'#141417',d:'#1c1c20',g:'#34343a',w:'#ffffff'};
  rows.forEach((row,ry)=>{
    for(let rx=0;rx<14;rx++){
      const c=CHAR_COLOR[row[rx]];
      if(!c) continue;
      ctx.fillStyle=c;
      ctx.fillRect(x+rx*px,y+ry*px,px,px);
    }
  });
}
function drawPowerup(p){
  const x=p.x,y=p.y;
  ctx.fillStyle='rgba(10,10,14,.85)';
  ctx.fillRect(x,y,22,22);
  ctx.strokeStyle='#ffc90e'; ctx.lineWidth=1.5;
  ctx.strokeRect(x+1,y+1,20,20);
  ctx.fillStyle='#ffc90e';
  switch(p.type){
    case 'star': star(x+11,y+11,8,5,10); break;
    case 'life': ctx.fillStyle='#4ade80'; ctx.fillRect(x+7,y+10,8,3); ctx.fillRect(x+9,y+7,3,9); break;
    case 'shield': ctx.strokeStyle='#22d3ee'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(x+11,y+11,7,0,Math.PI*2); ctx.stroke(); break;
    case 'bomb': ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(x+11,y+11,7,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffc90e'; ctx.fillRect(x+7,y+10,8,2); break;
    case 'helmet': ctx.fillStyle='#c9d2dd'; ctx.fillRect(x+5,y+9,12,7); ctx.fillRect(x+4,y+14,14,4); break;
  }
}
function star(cx,cy,spikes,outer,inner){
  ctx.beginPath();
  for(let i=0;i<spikes*2;i++){
    const r=i%2===0?outer:inner, a=Math.PI/spikes*i-Math.PI/2;
    const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
}
function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawMap();
  powerups.forEach(drawPowerup);
  if(player&&player.alive) drawTank(player);
  enemies.forEach(e=>{ if(e.alive) drawTank(e); });
  bullets.forEach(b=>{
    ctx.fillStyle=b.owner==='player'?'#ffc90e':'#e10622';
    ctx.fillRect(b.x,b.y,b.w,b.h);
  });
  /* 树（画在最上层） */
  for(let cy=0;cy<ROWS;cy++)for(let cx=0;cx<COLS;cx++){
    if(grid[cy][cx]==='T'){
      const x=cx*TILE,y=cy*TILE;
      ctx.fillStyle='rgba(34,110,54,.55)';
      ctx.beginPath(); ctx.arc(x+10,y+10,9,0,Math.PI*2); ctx.arc(x+22,y+10,9,0,Math.PI*2); ctx.arc(x+16,y+16,11,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(20,80,40,.6)'; ctx.fillRect(x+8,y+20,16,10);
    }
  }
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/.5);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    ctx.globalAlpha=1;
  });
  ctx.restore();
}

/* ================= 输入 ================= */
const keys=new Set(), dirQueue=[];
const KEY_DIR={ArrowUp:UP,KeyW:UP,ArrowRight:RIGHT,KeyD:RIGHT,ArrowDown:DOWN,KeyS:DOWN,ArrowLeft:LEFT,KeyA:LEFT};
let fireHeld=false, touchDir=null;

window.addEventListener('keydown',e=>{
  audio();
  if(e.code==='Space'||e.code==='KeyJ'){ fireHeld=true; e.preventDefault(); }
  if(KEY_DIR[e.code]!=null){
    keys.add(e.code);
    if(!dirQueue.includes(KEY_DIR[e.code])) dirQueue.push(KEY_DIR[e.code]);
    e.preventDefault();
  }
  if(e.code==='Enter'){
    if(state==='start'||state==='over') startGame();
    else if(state==='pause') togglePause();
  }
  if(e.code==='KeyP'||e.code==='Escape'){ if(state==='play'||state==='pause') togglePause(); }
  if(e.code==='KeyM') toggleMute();
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='KeyJ') fireHeld=false;
  if(KEY_DIR[e.code]!=null){
    keys.delete(e.code);
    dirQueue.length=0;
    keys.forEach(k=>{ const d=KEY_DIR[k]; if(d!=null&&!dirQueue.includes(d)) dirQueue.push(d); });
  }
});
window.addEventListener('blur',()=>{ keys.clear(); dirQueue.length=0; fireHeld=false; });

/* 触屏虚拟摇杆 */
const joy=$('joy'), knob=$('joyKnob'), fireBtn=$('fireBtn');
if(window.matchMedia('(pointer: coarse)').matches){
  let jId=null, jCx=0, jCy=0;
  joy.addEventListener('touchstart',e=>{ jId=e.changedTouches[0].identifier; const r=joy.getBoundingClientRect(); jCx=r.left+r.width/2; jCy=r.top+r.height/2; audio(); e.preventDefault(); });
  joy.addEventListener('touchmove',e=>{
    for(const t of e.changedTouches){ if(t.identifier===jId){
      const dx=t.clientX-jCx, dy=t.clientY-jCy, len=Math.hypot(dx,dy);
      if(len>2){
        const n=Math.min(len,40)/40;
        knob.style.transform='translate(calc(-50% + '+(dx/len*n*45)+'px), calc(-50% + '+(dy/len*n*45)+'px))';
      }
      if(len>12) touchDir=Math.abs(dx)>Math.abs(dy)?(dx>0?RIGHT:LEFT):(dy>0?DOWN:UP);
      e.preventDefault();
    }}
  },{passive:false});
  const joyEnd=e=>{ for(const t of e.changedTouches){ if(t.identifier===jId){ jId=null; touchDir=null; knob.style.transform=''; } } };
  joy.addEventListener('touchend',joyEnd);
  joy.addEventListener('touchcancel',joyEnd);
  fireBtn.addEventListener('touchstart',e=>{ fireHeld=true; audio(); e.preventDefault(); });
  fireBtn.addEventListener('touchend',()=>fireHeld=false);
}

/* ================= 主循环 ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= 按钮 ================= */
$('startBtn').addEventListener('click',()=>{ audio(); startGame(); });
$('restartBtn').addEventListener('click',()=>{ audio(); startGame(); });
$('resumeBtn').addEventListener('click',togglePause);
function toggleMute(){
  muted=!muted;
  $('muteBtn').textContent=muted?'音效 OFF':'音效 ON';
  if(muted&&actx) actx.suspend();
  if(!muted) audio();
}
$('muteBtn').addEventListener('click',toggleMute);
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play') togglePause(); });

/* ================= 敌我坦克图鉴（双方坦克同图展示） ================= */
function renderRoster(){
  const rc=$('roster'); if(!rc) return;
  const rctx=rc.getContext('2d');
  const items=[
    {s:ENEMY_SPRITES.player,c:ENEMY_COLORS.player,label:'我方'},
    {s:ENEMY_SPRITES.basic,c:ENEMY_COLORS.basic,label:'侦察'},
    {s:ENEMY_SPRITES.fast,c:ENEMY_COLORS.fast,label:'闪电'},
    {s:ENEMY_SPRITES.power,c:ENEMY_COLORS.power,label:'重炮'},
    {s:ENEMY_SPRITES.armor,c:ENEMY_COLORS.armor,label:'重甲'}
  ];
  rctx.clearRect(0,0,460,64);
  items.forEach((it,i)=>{
    const cx=46+i*92, cy=24;
    blitSprite(it.s,it.c,cx-14,cy-14,28);
    rctx.fillStyle='#a1a1aa';
    rctx.font='bold 11px "Courier New","SimSun",monospace';
    rctx.textAlign='center';
    rctx.fillText(it.label,cx,cy+28);
  });
}
renderRoster();

resetMap();
syncHud();
</script>
